# Does the company-account webhook twin accept the SAME shared secret the sync already uses?
#
# This repo holds GIVEX_SHARED_SECRET as an Actions secret (the sync authenticates its reads with
# it). This workflow calls the twin's /changes endpoint with that stored value and reports only the
# HTTP status. The secret is never printed — GitHub masks it, and only the status code is recorded.
#
# 200 on the twin  -> the value Peter pasted into the company Worker matches, byte for byte.
# 401 on the twin  -> it does not. Fix it before the cutover, not during.
# The old Worker is called too, as a control: if that is not 200 the stored secret itself is stale
# and the twin is not the problem.
name: Verify twin shared secret

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Call both Workers with the stored secret
        env:
          SECRET: ${{ secrets.GIVEX_SHARED_SECRET }}
          TWIN: https://mezza-givex-webhook.peter-nahas-87f.workers.dev
          LIVE: ${{ secrets.GIVEX_WEBHOOK_URL }}
        run: |
          set -u
          probe () {
            curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: $SECRET" \
              "$1/changes?since=0&limit=1" || echo "000"
          }
          TWIN_CODE=$(probe "$TWIN")
          LIVE_CODE=$(probe "$LIVE")
          # Unauthenticated control: proves the endpoint really is gated and a 200 means something.
          TWIN_ANON=$(curl -s -o /dev/null -w "%{http_code}" "$TWIN/changes?since=0&limit=1" || echo "000")

          echo "twin authenticated : $TWIN_CODE"
          echo "live authenticated : $LIVE_CODE"
          echo "twin anonymous     : $TWIN_ANON  (must NOT be 200)"

          mkdir -p deploy
          cat > deploy/twin-secret-check.json <<JSON
          {
            "checked_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "twin_authenticated": "$TWIN_CODE",
            "live_authenticated": "$LIVE_CODE",
            "twin_anonymous": "$TWIN_ANON",
            "verdict": "$( [ "$TWIN_CODE" = "200" ] && [ "$TWIN_ANON" != "200" ] && echo MATCH || echo MISMATCH )"
          }
          JSON
          cat deploy/twin-secret-check.json

          if [ "$LIVE_CODE" != "200" ]; then
            echo "::warning::the stored secret does not authenticate against the LIVE worker either — the stored copy may be stale"
          fi
          if [ "$TWIN_ANON" = "200" ]; then
            echo "::error::the twin answered /changes WITHOUT a secret — it is unprotected"; exit 1
          fi
          if [ "$TWIN_CODE" != "200" ]; then
            echo "::error::the twin rejected the stored secret (HTTP $TWIN_CODE) — the value on the company Worker does not match"; exit 1
          fi
          echo "MATCH — the company Worker accepts the same secret the sync uses"

      - name: Commit the result
        if: always()
        run: |
          git config user.name "mezza-scorecard bot" && git config user.email "scorecard@mezzascorecard.com"
          git add deploy/twin-secret-check.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "verify: twin shared secret check [skip ci]"
          git pull --rebase --quiet origin ${{ github.ref_name }} || true
          git push --quiet || true
